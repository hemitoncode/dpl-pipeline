[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpl-pipeline"
version = "0.1.0"
description = "Deterministic pipeline for classifying voting legislation impact (restrictive / expansive / election interference / neutral) at the Impact/Bill level"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "pypdf>=3.15",
    "PyYAML>=6.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dpl-pipeline = "dpl_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dpl_pipeline = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
